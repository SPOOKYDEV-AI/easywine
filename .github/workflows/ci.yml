
name: EasyWine CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: easywine-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          for file in $(find src public -name '*.js' -type f); do node --check "$file"; done
      - name: Test (no dependencies)
        run: npm test

  browser:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install test-only browser driver
        run: npm install --no-save --no-package-lock playwright@1.55.0 axe-core@4.14.0
      - name: Verify Chrome is available
        run: google-chrome --version
      - name: Exercise real browser journeys
        run: node tests/browser-smoke.mjs
      - name: Exercise MFA browser journeys
        run: node tests/browser-mfa.mjs
      - name: Verify loading, navigation, retry, reduced motion and lab metrics
        run: node tests/browser-ux.mjs
      - name: Verify instant navigation, slow-route loader and safe session switch
        run: node tests/browser-nav-fluid.mjs
      - name: Stress-test inventory list and responsive search
        run: node tests/browser-scale.mjs
      - name: Walk through first restaurant setup and recommendation
        run: node tests/browser-onboarding.mjs
      - name: Verify mobile navigation and accessibility
        run: node tests/browser-mobile-nav.mjs
      - name: Exercise finger-first tablet service, orientation and interrupted recommendations
        run: node tests/browser-tablet-service.mjs
      - name: Verify shared-tablet privacy warning, idle lock and reauthentication
        run: node tests/browser-tablet-security.mjs
      - name: Verify network resilience and browser history
        run: node tests/browser-network-history.mjs
      - name: Audit WCAG 2.2 A/AA across real workflows
        run: node tests/browser-a11y.mjs
      - name: Verify premium motion and interaction feedback
        run: node tests/browser-premium.mjs
      - name: Verify real loading and continuous accessible feedback
        run: node tests/browser-real-loading.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: easywine-browser-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
